<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BenchZero | ESN Operations & Inter-contrat Intelligence</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="BenchZero ESN ERP - Resource planning, bench risk forecasting, skills gap analytics, and AI-driven pitch matching." />

    <!-- Anti-Flash Theme Script: Synchronously applies .dark class before first paint -->
    <script>
      (function () {
        try {
          var key = 'zero_bench_theme';
          var saved = localStorage.getItem(key);
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface-bright dark:bg-slate-950 text-on-surface dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">
    <app-root></app-root>
  </body>
</html>
